name: CI

on:
  # push 只在 main 触发；其他分支经 PR 触发，避免同一提交跑两遍
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支 / PR 有新提交时取消旧的运行
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.13 为 package.json engines 下限（node:sqlite 免 flag 的最低版本）
        node: ['22.13', '22', '24']
        os: [ubuntu-latest]
        include:
          # 现场常用 Windows 笔记本部署，额外跑一组
          - node: '24'
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test
